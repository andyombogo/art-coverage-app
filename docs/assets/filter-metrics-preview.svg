    <g>
      <rect x="702" y="485" width="177" height="143" rx="18" fill="#E0ECE8" stroke="#CBDCD7"/>
      <text x="719" y="516" fill="#21475D" font-size="17" font-weight="700">Africa</text>
      <text x="719" y="550" fill="#173E54" font-size="20" font-weight="800">72.5%</text>
      <text x="719" y="589" fill="#617687" font-size="16" font-weight="700">41 countries</text>
    </g>
    <g>
      <rect x="891" y="485" width="177" height="143" rx="18" fill="#E0ECE8" stroke="#CBDCD7"/>
      <text x="908" y="516" fill="#21475D" font-size="17" font-weight="700">Europe</text>
      <text x="908" y="550" fill="#173E54" font-size="20" font-weight="800">69.8%</text>
      <text x="908" y="589" fill="#617687" font-size="16" font-weight="700">25 countries</text>
    </g>
    <g>
      <rect x="1080" y="485" width="178" height="143" rx="18" fill="#E0ECE8" stroke="#CBDCD7"/>
      <text x="1097" y="516" fill="#21475D" font-size="17" font-weight="700">Americas</text>
      <text x="1097" y="550" fill="#173E54" font-size="20" font-weight="800">67.2%</text>
      <text x="1097" y="589" fill="#617687" font-size="16" font-weight="700">25 countries</text>
    </g>
    <g>
      <rect x="702" y="643" width="177" height="165" rx="18" fill="#E0ECE8" stroke="#CBDCD7"/>
      <text x="719" y="675" fill="#21475D" font-size="17" font-weight="700">South-East Asia</text>
      <text x="719" y="709" fill="#173E54" font-size="20" font-weight="800">64.6%</text>
      <text x="719" y="749" fill="#617687" font-size="16" font-weight="700">9 countries</text>
    </g>
    <g>
      <rect x="891" y="643" width="177" height="165" rx="18" fill="#E0ECE8" stroke="#CBDCD7"/>
      <text x="908" y="675" fill="#21475D" font-size="17" font-weight="700">Western Pacific</text>
      <text x="908" y="709" fill="#173E54" font-size="20" font-weight="800">62.8%</text>
      <text x="908" y="749" fill="#617687" font-size="16" font-weight="700">10 countries</text>
    </g>
    <g>
      <rect x="1080" y="643" width="178" height="165" rx="18" fill="#E0ECE8" stroke="#CBDCD7"/>
      <text x="1097" y="675" fill="#21475D" font-size="17" font-weight="700">Eastern</text>
      <text x="1097" y="701" fill="#21475D" font-size="17" font-weight="700">Mediterranean</text>
      <text x="1097" y="729" fill="#173E54" font-size="20" font-weight="800">49.4%</text>
      <text x="1097" y="772" fill="#617687" font-size="16" font-weight="700">19 countries</text>
    </g>
