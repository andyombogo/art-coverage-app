  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1278" y2="825" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6FBFA"/>
      <stop offset="1" stop-color="#F1F6F5"/>
    </linearGradient>
