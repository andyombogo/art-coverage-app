<svg width="1260" height="412" viewBox="0 0 1260 412" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1260" height="412" rx="28" fill="#EEF4F3"/>
  <rect x="0.5" y="0.5" width="1259" height="411" rx="27.5" fill="url(#bg)" stroke="#D6E4E4"/>
  <text x="22" y="28" fill="#6A7C88" font-size="13" font-family="Arial, sans-serif" font-weight="700" letter-spacing="2">GLOBAL HIV RESPONSE DASHBOARD</text>
  <text x="22" y="78" fill="#163C53" font-size="58" font-family="Georgia, serif" font-weight="700">WHO ART Coverage</text>
  <text x="22" y="135" fill="#163C53" font-size="58" font-family="Georgia, serif" font-weight="700">Dashboard</text>
  <text x="22" y="206" fill="#617687" font-size="19" font-family="Arial, sans-serif">Explore country-level antiretroviral therapy coverage estimates across regions</text>
  <text x="22" y="238" fill="#617687" font-size="19" font-family="Arial, sans-serif">and years. The dashboard is tuned for portfolio presentation, fast cloud</text>
  <text x="22" y="270" fill="#617687" font-size="19" font-family="Arial, sans-serif">deployment, and policy-oriented storytelling.</text>

  <g>
