    <rect x="155" y="312" width="126" height="44" rx="22" fill="#DFECE9" stroke="#C8DAD6"/>
    <text x="172" y="339" fill="#20455B" font-size="14" font-family="Arial, sans-serif" font-weight="700">146 countries</text>

