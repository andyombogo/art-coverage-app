name: Python application

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 app.py dashboard tests --jobs=1 --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app.py dashboard tests --jobs=1 --count --max-complexity=12 --max-line-length=120 --statistics

      - name: Test with pytest
        run: |
          pytest -q
